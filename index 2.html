<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koreyscha so'z kartochkalari — TOPIK 3–4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2238;
    --paper: #fbfaf7;
    --bg: #eef1f5;
    --panel: #ffffff;
    --text: #1b2238;
    --soft: #6b7389;
    --line: #d8dde6;
    --gold: #e0a92a;
    --ok: #2a6f68;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141a2b; --panel: #1c2338; --text: #eef1f8; --soft: #8d96ae; --line: #2c3550; }
  }
  :root[data-theme="dark"] { --bg: #141a2b; --panel: #1c2338; --text: #eef1f8; --soft: #8d96ae; --line: #2c3550; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 36px 18px 60px; }
  button, input { font: inherit; color: inherit; }

  /* HEADER */
  header { margin-bottom: 24px; }
  h1 {
    font-family: "Noto Serif KR", serif;
    font-weight: 900;
    font-size: clamp(30px, 6vw, 46px);
    line-height: 1.1;
  }
  .sub { color: var(--soft); font-weight: 600; margin-top: 6px; }

  .progress { margin-top: 20px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .progress-top button { background: none; border: none; color: var(--soft); font-size: 13px; cursor: pointer; text-decoration: underline; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .4s ease; }

  /* CONTROLS */
  .controls { display: flex; flex-direction: column; gap: 12px; margin: 22px 0 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1;
    min-width: 180px;
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
  }
  .search:focus { outline: none; border-color: var(--text); }
  .btn {
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--text); }
  .btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip {
    background: transparent;
    border: 1.5px solid var(--c, var(--line));
    color: var(--text);
    border-radius: 99px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--c, var(--text)); color: #fff; }
  .chip[data-cat="all"].on { color: var(--bg); }

  /* GRID + CARDS */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { height: 300px; perspective: 1000px; cursor: pointer; outline: none; }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.3,1.35,.5,1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:focus-visible .inner { outline: 3px solid var(--gold); outline-offset: 4px; border-radius: 16px; }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    padding: 18px;
    box-shadow: 0 2px 0 rgba(27,34,56,.12), 0 14px 26px -14px rgba(27,34,56,.45);
  }
  .front {
    background: var(--paper);
    color: var(--ink);
    border-top: 8px solid var(--c);
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card.known .front { opacity: .72; }
  .front .cat { position: absolute; top: 12px; left: 16px; font-size: 12px; font-weight: 800; color: var(--c); }
  .front .tick {
    position: absolute; top: 10px; right: 12px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--ok); color: #fff; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .big-ko { font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 34px; line-height: 1.25; word-break: keep-all; }
  .big-uz { font-weight: 800; font-size: 26px; line-height: 1.25; }
  .hint { position: absolute; bottom: 14px; font-size: 12px; color: #8a90a2; }
  .speak {
    margin-top: 14px;
    background: none;
    border: 1.5px solid #d8dde6;
    border-radius: 99px;
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }

  .back { background: var(--c); color: #fff; transform: rotateY(180deg); gap: 6px; }
  .back .meaning { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .back .meaning.ko { font-family: "Noto Serif KR", serif; font-size: 26px; }
  .back .read { font-size: 14px; opacity: .85; }
  .ex { margin-top: 8px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.3); font-size: 13px; }
  .ex-ko { display: block; font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 14px; }
  .ex-uz { display: block; opacity: .85; margin-top: 2px; }
  .actions { margin-top: auto; display: flex; gap: 6px; }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    background: rgba(255,255,255,.18);
    color: #fff;
  }
  .actions button[data-act="know"] { background: #fff; color: var(--ink); }
  .actions button.sp { flex: 0 0 40px; }

  .empty { grid-column: 1 / -1; text-align: center; padding: 40px 10px; color: var(--soft); }
  .empty button { margin-top: 12px; }

  footer { margin-top: 40px; font-size: 13px; color: var(--soft); }

  @media (prefers-reduced-motion: reduce) { .inner, .bar span { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>한국어 카드</h1>
    <p class="sub">TOPIK 3–4 darajadagi so'zlar va iboralar — misol gaplar bilan</p>
    <div class="progress">
      <div class="progress-top">
        <span id="progressText">Bilaman: 0 / 0</span>
        <button id="resetProgress" type="button">Progressni tozalash</button>
      </div>
      <div class="bar"><span id="bar"></span></div>
    </div>
  </header>

  <section class="controls">
    <div class="row">
      <input id="search" class="search" type="search" placeholder="Qidirish: koreyscha yoki o'zbekcha…">
    </div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="btn" id="modeBtn" type="button">Rejim: Koreyscha → O'zbekcha</button>
      <button class="btn" id="reviewBtn" type="button">Faqat takrorlanadiganlar</button>
      <button class="btn" id="shuffleBtn" type="button">Aralashtirish</button>
      <button class="btn" id="closeBtn" type="button">Hammasini yopish</button>
    </div>
  </section>

  <div class="grid" id="grid"></div>

  <footer>Bobomurod tomonidan HTML, CSS va JavaScript yordamida yaratilgan.</footer>
</main>

<script>
const CATS = {
  ish:    { name: "Ish",           color: "#2f5d9b" },
  talim:  { name: "Ta'lim",        color: "#6a4c93" },
  his:    { name: "His-tuyg'u",    color: "#c23b22" },
  hayot:  { name: "Kundalik hayot",color: "#2a6f68" },
  salom:  { name: "Sog'liq",       color: "#b5651d" },
  ibora:  { name: "Iboralar",      color: "#3d5a2a" }
};

const WORDS = [
  { cat:"ish", ko:"경험", read:"gyeongheom", uz:"Tajriba", exKo:"이 일에 경험이 많아요.", exUz:"Bu ishda tajribam ko'p." },
  { cat:"ish", ko:"지원하다", read:"jiwonhada", uz:"Ariza topshirmoq", exKo:"그 회사에 지원했어요.", exUz:"O'sha kompaniyaga ariza topshirdim." },
  { cat:"ish", ko:"면접", read:"myeonjeop", uz:"Ishga qabul suhbati", exKo:"내일 면접을 봐요.", exUz:"Ertaga ishga qabul suhbatidan o'taman." },
  { cat:"ish", ko:"승진", read:"seungjin", uz:"Lavozim ko'tarilishi", exKo:"올해 승진했어요.", exUz:"Bu yil lavozimim ko'tarildi." },
  { cat:"ish", ko:"퇴근하다", read:"toegeunhada", uz:"Ishdan chiqmoq", exKo:"보통 여섯 시에 퇴근해요.", exUz:"Odatda soat oltida ishdan chiqaman." },
  { cat:"ish", ko:"업무", read:"eommu", uz:"Ish vazifasi", exKo:"요즘 업무가 너무 많아요.", exUz:"Hozir ish vazifalari juda ko'p." },
  { cat:"ish", ko:"회의", read:"hoei", uz:"Yig'ilish", exKo:"오후에 회의가 있어요.", exUz:"Tushdan keyin yig'ilish bor." },
  { cat:"ish", ko:"월급", read:"wolgeup", uz:"Oylik maosh", exKo:"오늘 월급을 받았어요.", exUz:"Bugun oylik oldim." },

  { cat:"talim", ko:"전공", read:"jeongong", uz:"Mutaxassislik", exKo:"제 전공은 컴퓨터 공학이에요.", exUz:"Mening mutaxassisligim — kompyuter muhandisligi." },
  { cat:"talim", ko:"졸업하다", read:"joreopada", uz:"Bitirmoq (o'qishni)", exKo:"작년에 대학교를 졸업했어요.", exUz:"O'tgan yili universitetni bitirdim." },
  { cat:"talim", ko:"장학금", read:"janghakkeum", uz:"Stipendiya, grant", exKo:"이번 학기에 장학금을 받았어요.", exUz:"Bu semestrda grant oldim." },
  { cat:"talim", ko:"과제", read:"gwaje", uz:"Uy vazifasi, topshiriq", exKo:"과제를 아직 못 했어요.", exUz:"Topshiriqni hali qila olmadim." },
  { cat:"talim", ko:"발표", read:"balpyo", uz:"Taqdimot, ma'ruza", exKo:"수업에서 발표를 했어요.", exUz:"Darsda taqdimot qildim." },
  { cat:"talim", ko:"복습하다", read:"bokseupada", uz:"Takrorlamoq (darsni)", exKo:"수업 후에 꼭 복습해요.", exUz:"Darsdan keyin albatta takrorlayman." },
  { cat:"talim", ko:"등록금", read:"deungnokkeum", uz:"O'qish to'lovi (kontrakt)", exKo:"등록금이 너무 비싸요.", exUz:"O'qish to'lovi juda qimmat." },
  { cat:"talim", ko:"논문", read:"nonmun", uz:"Ilmiy ish, dissertatsiya", exKo:"요즘 논문을 쓰고 있어요.", exUz:"Hozir ilmiy ish yozyapman." },

  { cat:"his", ko:"부럽다", read:"bureoptta", uz:"Havas qilmoq", exKo:"친구가 정말 부러워요.", exUz:"Do'stimga juda havasim keladi." },
  { cat:"his", ko:"답답하다", read:"dapdapada", uz:"Siqilmoq, ichi qisilmoq", exKo:"말이 안 통해서 답답해요.", exUz:"Tushunisha olmaganimiz uchun siqilyapman." },
  { cat:"his", ko:"서운하다", read:"seounhada", uz:"Ranjimoq, ko'ngli qolmoq", exKo:"친구가 연락을 안 해서 서운해요.", exUz:"Do'stim bog'lanmagani uchun ranjidim." },
  { cat:"his", ko:"설레다", read:"seolleda", uz:"Hayajonlanmoq (quvonchdan)", exKo:"내일 여행을 가서 설레요.", exUz:"Ertaga sayohatga ketaman, hayajondaman." },
  { cat:"his", ko:"그립다", read:"geuriptta", uz:"Sog'inmoq", exKo:"고향이 그리워요.", exUz:"Vatanimni sog'indim." },
  { cat:"his", ko:"후회하다", read:"huhoehada", uz:"Afsuslanmoq", exKo:"그 결정을 후회하지 않아요.", exUz:"O'sha qarorimdan afsuslanmayman." },
  { cat:"his", ko:"긴장하다", read:"ginjanghada", uz:"Asabiylashmoq, hayajonlanmoq", exKo:"면접 때문에 긴장돼요.", exUz:"Ishga qabul suhbati tufayli asabim tarang." },
  { cat:"his", ko:"만족하다", read:"manjokada", uz:"Mamnun bo'lmoq", exKo:"시험 결과에 만족해요.", exUz:"Imtihon natijasidan mamnunman." },

  { cat:"hayot", ko:"약속", read:"yaksok", uz:"Uchrashuv; va'da", exKo:"오늘 친구와 약속이 있어요.", exUz:"Bugun do'stim bilan uchrashuvim bor." },
  { cat:"hayot", ko:"이사하다", read:"isahada", uz:"Ko'chib o'tmoq", exKo:"다음 달에 이사해요.", exUz:"Keyingi oy ko'chib o'taman." },
  { cat:"hayot", ko:"환전하다", read:"hwanjeonhada", uz:"Pul almashtirmoq", exKo:"은행에서 돈을 환전했어요.", exUz:"Bankda pul almashtirdim." },
  { cat:"hayot", ko:"교통카드", read:"gyotongkadeu", uz:"Transport kartasi", exKo:"교통카드를 충전했어요.", exUz:"Transport kartasini to'ldirdim." },
  { cat:"hayot", ko:"월세", read:"wolse", uz:"Oylik ijara haqi", exKo:"올해 월세가 올랐어요.", exUz:"Bu yil ijara haqi oshdi." },
  { cat:"hayot", ko:"택배", read:"taekbae", uz:"Posilka, yetkazib berish", exKo:"택배가 도착했어요.", exUz:"Posilka yetib keldi." },
  { cat:"hayot", ko:"분리수거", read:"bullisugeo", uz:"Chiqindini saralash", exKo:"분리수거를 꼭 해야 돼요.", exUz:"Chiqindini albatta saralash kerak." },
  { cat:"hayot", ko:"예약하다", read:"yeyakada", uz:"Band qilmoq", exKo:"식당을 미리 예약했어요.", exUz:"Restoranni oldindan band qildim." },

  { cat:"salom", ko:"증상", read:"jeungsang", uz:"Alomat, belgi", exKo:"어떤 증상이 있어요?", exUz:"Qanday alomatlaringiz bor?" },
  { cat:"salom", ko:"처방전", read:"cheobangjeon", uz:"Retsept", exKo:"약국에 처방전을 냈어요.", exUz:"Dorixonaga retseptni berdim." },
  { cat:"salom", ko:"감기에 걸리다", read:"gamgie geollida", uz:"Shamollamoq", exKo:"날씨가 추워서 감기에 걸렸어요.", exUz:"Havo sovuq bo'lgani uchun shamolladim." },
  { cat:"salom", ko:"건강", read:"geongang", uz:"Sog'liq", exKo:"건강이 제일 중요해요.", exUz:"Sog'liq eng muhimi." },
  { cat:"salom", ko:"입원하다", read:"ibwonhada", uz:"Kasalxonaga yotmoq", exKo:"일주일 동안 입원했어요.", exUz:"Bir hafta kasalxonada yotdim." },
  { cat:"salom", ko:"회복하다", read:"hoebokada", uz:"Tuzalmoq", exKo:"빨리 회복하세요.", exUz:"Tezroq tuzaling." },

  { cat:"ibora", ko:"눈이 높다", read:"nuni noptta", uz:"Talabchan, didi baland", exKo:"그 사람은 눈이 높아요.", exUz:"U odamning didi juda baland." },
  { cat:"ibora", ko:"발이 넓다", read:"bari neoltta", uz:"Tanishlari ko'p", exKo:"제 친구는 발이 넓어요.", exUz:"Do'stimning tanishlari juda ko'p." },
  { cat:"ibora", ko:"손이 크다", read:"soni keuda", uz:"Qo'li ochiq, saxiy", exKo:"어머니는 손이 커요.", exUz:"Onamning qo'li ochiq." },
  { cat:"ibora", ko:"귀가 얇다", read:"gwiga yaltta", uz:"Gapga tez ishonadigan", exKo:"저는 귀가 얇아서 자주 속아요.", exUz:"Gapga tez ishonganim uchun tez-tez aldanaman." },
  { cat:"ibora", ko:"입이 무겁다", read:"ibi mugeoptta", uz:"Sir saqlay oladigan", exKo:"그는 입이 무거운 사람이에요.", exUz:"U sir saqlay oladigan odam." },
  { cat:"ibora", ko:"식은 죽 먹기", read:"sigeun juk meokgi", uz:"Juda oson ish", exKo:"이 문제는 식은 죽 먹기예요.", exUz:"Bu masala juda oson." },
  { cat:"ibora", ko:"그림의 떡", read:"geurime tteok", uz:"Erishib bo'lmaydigan narsa", exKo:"그 차는 저한테 그림의 떡이에요.", exUz:"U mashina men uchun orzu bo'lib qoladi." },
  { cat:"ibora", ko:"티끌 모아 태산", read:"tikkeul moa taesan", uz:"Tomchi-tomchi ko'l bo'lur", exKo:"티끌 모아 태산이라고 매일 저축해요.", exUz:"Tomchi-tomchi ko'l bo'lur deb, har kuni jamg'araman." }
];
WORDS.forEach((w, i) => w.id = i);

const STORE_KEY = "koreanCards.known";
let known = new Set();
try {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...known])); } catch (e) {}
}

let state = { cat: "all", q: "", mode: "ko", review: false, order: WORDS.map(w => w.id) };
let flipped = new Set();

const grid = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const modeBtn = document.getElementById("modeBtn");
const reviewBtn = document.getElementById("reviewBtn");

// Kategoriya tugmalari
function renderChips() {
  const all = [["all", "Hammasi", ""]].concat(Object.entries(CATS).map(([k, v]) => [k, v.name, v.color]));
  chipsEl.innerHTML = all.map(([k, name, color]) => {
    const count = k === "all" ? WORDS.length : WORDS.filter(w => w.cat === k).length;
    return `<button type="button" class="chip ${state.cat === k ? "on" : ""}" data-cat="${k}" style="${color ? "--c:" + color : ""}">${name} ${count}</button>`;
  }).join("");
}

function visibleWords() {
  const q = state.q.trim().toLowerCase();
  return state.order
    .map(id => WORDS[id])
    .filter(w => state.cat === "all" || w.cat === state.cat)
    .filter(w => !state.review || !known.has(w.id))
    .filter(w => !q || w.ko.includes(q) || w.uz.toLowerCase().includes(q) || w.read.includes(q));
}

function render() {
  const list = visibleWords();
  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <p>${state.review ? "Bu bo'limdagi hamma so'zni bilasiz! Zo'r natija." : "Hech narsa topilmadi. Boshqa so'z bilan qidirib ko'ring."}</p>
      <button type="button" class="btn" id="clearFilters">Filtrlarni tozalash</button>
    </div>`;
  } else {
    grid.innerHTML = list.map(w => {
      const c = CATS[w.cat];
      const isKo = state.mode === "ko";
      return `<div class="card ${flipped.has(w.id) ? "flipped" : ""} ${known.has(w.id) ? "known" : ""}" data-id="${w.id}" tabindex="0" role="button" aria-label="Kartochkani aylantirish" style="--c:${c.color}">
        <div class="inner">
          <div class="face front">
            <span class="cat">${c.name}</span>
            ${known.has(w.id) ? '<span class="tick">✓</span>' : ""}
            <span class="${isKo ? "big-ko" : "big-uz"}">${isKo ? w.ko : w.uz}</span>
            ${isKo ? '<button type="button" class="speak" data-speak="' + w.id + '">🔊 Tinglash</button>' : ""}
            <span class="hint">Bosing — javob chiqadi</span>
          </div>
          <div class="face back">
            <span class="meaning ${isKo ? "" : "ko"}">${isKo ? w.uz : w.ko}</span>
            <span class="read">${w.read}</span>
            <div class="ex">
              <span class="ex-ko">${w.exKo}</span>
              <span class="ex-uz">${w.exUz}</span>
            </div>
            <div class="actions">
              <button type="button" data-act="know">${known.has(w.id) ? "Bilaman ✓" : "Bilaman"}</button>
              <button type="button" data-act="review">Takrorlash</button>
              <button type="button" class="sp" data-speak="${w.id}" aria-label="Tinglash">🔊</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join("");
  }
  updateProgress();
}

function updateProgress() {
  const n = known.size, total = WORDS.length;
  document.getElementById("progressText").textContent = `Bilaman: ${n} / ${total}`;
  document.getElementById("bar").style.width = (n / total * 100) + "%";
}

function speak(id) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(WORDS[id].ko);
  u.lang = "ko-KR";
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function toggleCard(card) {
  const id = +card.dataset.id;
  flipped.has(id) ? flipped.delete(id) : flipped.add(id);
  card.classList.toggle("flipped");
}

// Kartochkalar ustidagi bosishlar
grid.addEventListener("click", e => {
  if (e.target.id === "clearFilters") {
    state.cat = "all"; state.q = ""; state.review = false;
    document.getElementById("search").value = "";
    reviewBtn.classList.remove("on");
    renderChips(); render();
    return;
  }
  const speakBtn = e.target.closest("[data-speak]");
  if (speakBtn) { e.stopPropagation(); speak(+speakBtn.dataset.speak); return; }

  const act = e.target.closest("[data-act]");
  const card = e.target.closest(".card");
  if (!card) return;
  const id = +card.dataset.id;

  if (act) {
    e.stopPropagation();
    if (act.dataset.act === "know") known.add(id); else known.delete(id);
    flipped.delete(id);
    saveKnown();
    render();
    return;
  }
  toggleCard(card);
});

grid.addEventListener("keydown", e => {
  const card = e.target.closest(".card");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    toggleCard(card);
  }
});

chipsEl.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  state.cat = chip.dataset.cat;
  renderChips(); render();
});

document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value;
  render();
});

modeBtn.addEventListener("click", () => {
  state.mode = state.mode === "ko" ? "uz" : "ko";
  modeBtn.textContent = state.mode === "ko" ? "Rejim: Koreyscha → O'zbekcha" : "Rejim: O'zbekcha → Koreyscha";
  flipped.clear();
  render();
});

reviewBtn.addEventListener("click", () => {
  state.review = !state.review;
  reviewBtn.classList.toggle("on", state.review);
  render();
});

document.getElementById("shuffleBtn").addEventListener("click", () => {
  const a = state.order;
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  flipped.clear();
  render();
});

document.getElementById("closeBtn").addEventListener("click", () => {
  flipped.clear();
  render();
});

document.getElementById("resetProgress").addEventListener("click", () => {
  known.clear();
  saveKnown();
  render();
});

renderChips();
render();
</script>
</body>
</html>
